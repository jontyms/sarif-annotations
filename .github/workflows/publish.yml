name: "Publish Immutable Action Version"

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checking out
        uses: actions/checkout@v4

      - name: Publish Immutable Action
        id: publish
        uses: actions/publish-immutable-action@0.0.4
        with:
          action-path: '.'

      - name: Log published version
        run: |
          echo "Published immutable action version: ${{ steps.publish.outputs.published-version }}"
          echo "Action can now be referenced as: ${{ github.repository }}@${{ steps.publish.outputs.published-version }}"
