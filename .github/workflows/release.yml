name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Check if this is a prerelease (contains alpha, beta, rc, or pre)
          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "Releasing version: $VERSION"
          echo "Is prerelease: $(if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then echo true; else echo false; fi)"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      discussions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Get the previous tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n1)

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "No previous tag found, generating changelog from first commit"
            COMMIT_RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          else
            echo "Previous tag: $PREVIOUS_TAG"
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md

          # Generate changelog from commits
          git log $COMMIT_RANGE --pretty=format:"- %s (@%an)" --reverse >> changelog.md

          # Add contributors
          echo "" >> changelog.md
          echo "## Contributors" >> changelog.md
          git log $COMMIT_RANGE --pretty=format:"%an" | sort | uniq | sed 's/^/- @/' >> changelog.md

          echo "Generated changelog:"
          cat changelog.md

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          release_name: ${{ needs.validate.outputs.version }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ needs.validate.outputs.is-prerelease }}

      - name: Update major version tag
        if: needs.validate.outputs.is-prerelease == 'false'
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          MAJOR_VERSION=$(echo $VERSION | sed 's/v\([0-9]*\).*/v\1/')

          echo "Updating major version tag: $MAJOR_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete existing major version tag if it exists
          git tag -d $MAJOR_VERSION 2>/dev/null || true
          git push origin :refs/tags/$MAJOR_VERSION 2>/dev/null || true

          # Create new major version tag
          git tag $MAJOR_VERSION
          git push origin $MAJOR_VERSION

  post-release:
    name: Post Release Tasks
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: always() && needs.release.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update documentation
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          MAJOR_VERSION=$(echo $VERSION | sed 's/v\([0-9]*\).*/v\1/')

          echo "## 📢 Release $VERSION is now available!" > release_notes.md
          echo "" >> release_notes.md
          echo "You can now use this action with:" >> release_notes.md
          echo "" >> release_notes.md
          echo '```yaml' >> release_notes.md
          echo "- uses: ${{ github.repository }}@$VERSION" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "Or use the major version tag for automatic updates:" >> release_notes.md
          echo "" >> release_notes.md
          echo '```yaml' >> release_notes.md
          echo "- uses: ${{ github.repository }}@$MAJOR_VERSION" >> release_notes.md
          echo '```' >> release_notes.md

          cat release_notes.md

      - name: Create issue for documentation update
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.validate.outputs.version }}';
            const majorVersion = version.replace(/v(\d+).*/, 'v$1');

            const issueBody = `## 📚 Update Documentation for Release ${version}

            This issue tracks documentation updates needed for the new release.

            ### Tasks
            - [ ] Update README.md examples to use ${version} or ${majorVersion}
            - [ ] Update any hardcoded version references
            - [ ] Review and update feature documentation
            - [ ] Update changelog if needed
            - [ ] Check marketplace listing is up to date

            ### Release Information
            - **Version**: ${version}
            - **Major Version Tag**: ${majorVersion}
            - **Is Prerelease**: ${{ needs.validate.outputs.is-prerelease }}

            This issue will be automatically closed when the release is complete.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📚 Documentation updates for ${version}`,
              body: issueBody,
              labels: ['documentation', 'release']
            });
