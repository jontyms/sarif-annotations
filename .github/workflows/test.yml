name: Test SARIF to Annotations Action
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-action:
    name: Test Action Functionality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python test_converter.py

      - name: Test CLI interface
        run: |
          python main.py example.sarif --level warning --max 5

      - name: Test action with example SARIF
        uses: ./
        with:
          sarif-file: 'example.sarif'
          annotation-level: 'warning'
          max-annotations: 5
        id: test-example

      - name: Verify action outputs
        run: |
          echo "Annotations created: ${{ steps.test-example.outputs.annotations-created }}"
          echo "Results processed: ${{ steps.test-example.outputs.results-processed }}"
          echo "Errors found: ${{ steps.test-example.outputs.errors-found }}"
          echo "Warnings found: ${{ steps.test-example.outputs.warnings-found }}"

          # Verify outputs are set and numeric
          if [[ -z "${{ steps.test-example.outputs.annotations-created }}" ]]; then
            echo "❌ annotations-created output not set"
            exit 1
          fi

          if ! [[ "${{ steps.test-example.outputs.annotations-created }}" =~ ^[0-9]+$ ]]; then
            echo "❌ annotations-created is not a number"
            exit 1
          fi

          echo "✅ All outputs are properly set"

  test-with-filters:
    name: Test Rule Filtering
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test with rule filtering
        uses: ./
        with:
          sarif-file: 'example.sarif'
          filter-rules: 'yaml[truthy],name[play]'
          max-annotations: 3
        id: test-filter

      - name: Test with rule exclusion
        uses: ./
        with:
          sarif-file: 'example.sarif'
          exclude-rules: 'command-instead-of-module'
          annotation-level: 'notice'
          max-annotations: 8
        id: test-exclude

      - name: Show filtering results
        run: |
          echo "Filtered results: ${{ steps.test-filter.outputs.annotations-created }} annotations"
          echo "Excluded results: ${{ steps.test-exclude.outputs.annotations-created }} annotations"

  test-error-handling:
    name: Test Error Handling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test with non-existent file
        uses: ./
        with:
          sarif-file: 'non-existent.sarif'
        continue-on-error: true
        id: test-missing

      - name: Verify error handling
        run: |
          if [[ "${{ steps.test-missing.outcome }}" == "success" ]]; then
            echo "❌ Action should have failed with missing file"
            exit 1
          fi
          echo "✅ Error handling works correctly"

  test-performance:
    name: Test Performance with Large File
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create large SARIF file
        run: |
          python3 << 'EOF'
          import json

          # Create SARIF with many results
          sarif = {
              "$schema": "https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0-rtm.5.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "performance-test",
                          "version": "1.0.0",
                          "rules": [{
                              "id": "perf-rule",
                              "shortDescription": {"text": "Performance test rule"},
                              "defaultConfiguration": {"level": "warning"}
                          }]
                      }
                  },
                  "results": []
              }]
          }

          # Add 50 results
          for i in range(50):
              result = {
                  "ruleId": "perf-rule",
                  "level": "warning",
                  "message": {"text": f"Performance test result #{i+1}"},
                  "locations": [{
                      "physicalLocation": {
                          "artifactLocation": {"uri": f"test{i%5}.py"},
                          "region": {"startLine": i+1, "startColumn": 1}
                      }
                  }]
              }
              sarif["runs"][0]["results"].append(result)

          with open("performance-test.sarif", "w") as f:
              json.dump(sarif, f, indent=2)

          print(f"Created performance test SARIF with {len(sarif['runs'][0]['results'])} results")
          EOF

      - name: Test with large file
        uses: ./
        with:
          sarif-file: 'performance-test.sarif'
          max-annotations: 10
        id: test-performance

      - name: Verify performance test
        run: |
          annotations="${{ steps.test-performance.outputs.annotations-created }}"
          processed="${{ steps.test-performance.outputs.results-processed }}"

          echo "Performance test results:"
          echo "  Annotations: $annotations"
          echo "  Processed: $processed"

          if [[ "$annotations" -gt 10 ]]; then
            echo "❌ Too many annotations created"
            exit 1
          fi

          if [[ "$processed" -ne 50 ]]; then
            echo "❌ Should have processed 50 results"
            exit 1
          fi

          echo "✅ Performance test passed"

  validate-action-metadata:
    name: Validate Action Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate action.yml
        run: |
          # Check that action.yml exists and has required fields
          if [[ ! -f "action.yml" ]]; then
            echo "❌ action.yml not found"
            exit 1
          fi

          # Check for required fields using Python
          python3 << 'EOF'
          import yaml

          with open('action.yml', 'r') as f:
              action = yaml.safe_load(f)

          required_fields = ['name', 'description', 'inputs', 'outputs', 'runs']

          for field in required_fields:
              if field not in action:
                  print(f"❌ Missing required field: {field}")
                  exit(1)

          # Check required inputs
          required_inputs = ['sarif-file']
          for inp in required_inputs:
              if inp not in action['inputs']:
                  print(f"❌ Missing required input: {inp}")
                  exit(1)

          print("✅ action.yml is valid")
          EOF

      - name: Check branding
        run: |
          if ! grep -q "branding:" action.yml; then
            echo "⚠️  No branding section found in action.yml"
          else
            echo "✅ Branding section found"
          fi
