name: 'SARIF to GitHub Annotations'
description: 'Convert SARIF 2.1.0 files to GitHub annotations for better code review visibility'
author: 'sarif-annotations'

inputs:
  sarif-file:
    description: 'Path to the SARIF file to convert'
    required: true
  annotation-level:
    description: 'Default annotation level (error, warning, notice)'
    required: false
    default: 'warning'
  max-annotations:
    description: 'Maximum number of annotations to create (GitHub limit is 10 per step)'
    required: false
    default: '10'
  filter-rules:
    description: 'Comma-separated list of rule IDs to include (empty = all rules)'
    required: false
    default: ''
  exclude-rules:
    description: 'Comma-separated list of rule IDs to exclude'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for relative file paths'
    required: false
    default: '.'

outputs:
  annotations-created:
    description: 'Number of annotations created'
  results-processed:
    description: 'Total number of SARIF results processed'
  errors-found:
    description: 'Number of error-level results found'
  warnings-found:
    description: 'Number of warning-level results found'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Convert SARIF to Annotations
      shell: bash
      env:
        SARIF_FILE: ${{ inputs.sarif-file }}
        ANNOTATION_LEVEL: ${{ inputs.annotation-level }}
        MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
        FILTER_RULES: ${{ inputs.filter-rules }}
        EXCLUDE_RULES: ${{ inputs.exclude-rules }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        cd "${{ inputs.working-directory }}"
        python ${{ github.action_path }}/sarif_converter.py

branding:
  icon: 'alert-triangle'
  color: 'orange'
